<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>🎲 D&D Онлайн-стол v3.0</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial; background: #1a1a2e; color: #eee; max-width: 900px; margin: 20px auto; padding: 0 20px; }
        h2 { color: #c7a252; }
        .flex { display: flex; gap: 8px; flex-wrap: wrap; }
        input, button { padding: 10px; border: none; border-radius: 6px; font-size: 14px; }
        input { flex: 1; background: #2a2a3e; color: #fff; min-width: 100px; }
        button { background: #c7a252; color: #1a1a2e; font-weight: bold; cursor: pointer; }
        button:hover { opacity: 0.8; }
        .container { display: flex; flex-direction: column; gap: 10px; }
        #log { height: 300px; overflow-y: auto; border: 1px solid #3a3a4e; padding: 10px; background: #22223a; border-radius: 8px; font-size: 14px; }
        #log div { margin: 3px 0; padding: 4px 10px; border-radius: 4px; background: #2a2a42; }
        .system { color: #a6e3a1; }
        .roll { color: #f9e2af; }
        .map-cell { font-family: monospace; font-size: 18px; }
        #mapDisplay { background: #111122; padding: 10px; border-radius: 8px; font-family: monospace; font-size: 16px; white-space: pre; overflow-x: auto; border: 1px solid #3a3a4e; }
        .status-bar { background: #2a2a3e; padding: 10px 15px; border-radius: 6px; margin-bottom: 5px; font-size: 14px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
        .status-bar span { color: #c7a252; font-weight: bold; }
        .badge { background: #c7a252; color: #1a1a2e; padding: 2px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }
        .row { display: flex; gap: 10px; flex-wrap: wrap; }
        .row > * { flex: 1; min-width: 200px; }
    </style>
</head>
<body>
    <h2>🎲 D&D Онлайн-стол v3.0</h2>
    
    <div class="status-bar">
        <div>👤 <span id="playerNameDisplay">Не подключён</span></div>
        <div>🏷️ <span id="playerStats">-</span></div>
        <div><span class="badge" id="turnDisplay">Ожидание...</span></div>
    </div>
    
    <div class="flex" style="margin-bottom: 10px;">
        <input id="nameInput" placeholder="Имя игрока" value="Танк">
        <button id="connectBtn">Подключиться</button>
        <button id="mapBtn" style="background: #6c7a89;">🗺️ Карта</button>
        <button id="helpBtn" style="background: #6c7a89;">❓</button>
    </div>

    <div class="row">
        <div id="log">📌 Введите имя и нажмите "Подключиться"</div>
        <div id="mapDisplay">Карта появится здесь</div>
    </div>

    <div class="flex" style="margin-top: 8px;">
        <input id="msgInput" placeholder="Сообщение или команда (/roll d20, /move 3 5, /help)">
        <button id="sendBtn">Отправить</button>
    </div>

    <script>
        const log = document.getElementById('log');
        const mapDisplay = document.getElementById('mapDisplay');
        const nameInput = document.getElementById('nameInput');
        const msgInput = document.getElementById('msgInput');
        const playerNameDisplay = document.getElementById('playerNameDisplay');
        const playerStats = document.getElementById('playerStats');
        const turnDisplay = document.getElementById('turnDisplay');
        let ws = null;
        let myName = '';

        function addMessage(text, type = '') {
            const div = document.createElement('div');
            div.textContent = text;
            if (type) div.className = type;
            log.appendChild(div);
            log.scrollTop = log.scrollHeight;
            // Если сообщение содержит карту, обновляем карту
            if (text.includes('Карта:')) {
                mapDisplay.textContent = text;
            }
        }

        function updateMap(text) {
            if (text && text.includes('Карта:')) {
                mapDisplay.textContent = text;
            }
        }

        function connect() {
            const name = nameInput.value.trim();
            if (!name) { alert('Введите имя!'); return; }
            if (ws && ws.readyState === WebSocket.OPEN) {
                addMessage('⚠️ Вы уже подключены!', 'system');
                return;
            }

            myName = name;
            ws = new WebSocket(`ws://127.0.0.1:8000/ws/${encodeURIComponent(name)}`);
            ws.onopen = () => {
                addMessage(`✅ Подключено как ${name}`, 'system');
                playerNameDisplay.textContent = name;
                document.getElementById('connectBtn').textContent = 'Отключиться';
                // Сразу запрашиваем карту и статус
                ws.send('/map');
                ws.send('/status');
            };
            ws.onmessage = (e) => {
                const msg = e.data;
                if (msg.includes('🎲') || msg.includes('❤️') || msg.includes('⚔️') || msg.includes('⏭️')) {
                    addMessage(msg, 'roll');
                } else if (msg.includes('Карта:')) {
                    mapDisplay.textContent = msg;
                    addMessage('🗺️ Карта обновлена', 'system');
                } else if (msg.includes('📊') && msg.includes(myName)) {
                    playerStats.textContent = msg.replace('📊 ', '');
                } else if (msg.includes('📋 Инициатива:')) {
                    addMessage(msg, 'system');
                } else if (msg.includes('👉')) {
                    // Обновляем индикатор хода
                    const match = msg.match(/👉 (\w+)/);
                    if (match) turnDisplay.textContent = `Ход: ${match[1]}`;
                } else {
                    addMessage(msg);
                }
            };
            ws.onclose = () => {
                addMessage('❌ Отключено от сервера', 'system');
                playerNameDisplay.textContent = 'Не подключён';
                playerStats.textContent = '-';
                document.getElementById('connectBtn').textContent = 'Подключиться';
                ws = null;
            };
            ws.onerror = (e) => {
                addMessage('⚠️ Ошибка соединения', 'system');
            };
        }

        function disconnect() {
            if (ws) { ws.close(); ws = null; }
        }

        function sendMessage() {
            const text = msgInput.value.trim();
            if (!text) return;
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                addMessage('⚠️ Сначала подключитесь к серверу!', 'system');
                return;
            }
            ws.send(text);
            msgInput.value = '';
            if (!text.startsWith('/')) {
                addMessage(`📤 Вы: ${text}`);
            }
        }

        // --- Обработчики ---
        document.getElementById('connectBtn').addEventListener('click', () => {
            if (ws && ws.readyState === WebSocket.OPEN) disconnect();
            else connect();
        });

        document.getElementById('sendBtn').addEventListener('click', sendMessage);
        msgInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });
        nameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') connect(); });

        document.getElementById('mapBtn').addEventListener('click', () => {
            if (ws && ws.readyState === WebSocket.OPEN) ws.send('/map');
            else addMessage('⚠️ Сначала подключитесь!', 'system');
        });

        document.getElementById('helpBtn').addEventListener('click', () => {
            if (ws && ws.readyState === WebSocket.OPEN) ws.send('/help');
            else addMessage('⚠️ Сначала подключитесь!', 'system');
        });
    </script>
</body>
</html>
