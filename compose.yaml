name: dnd-vtt

services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "no", "--save", "", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [backend]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      VTT_ENVIRONMENT: ${VTT_ENVIRONMENT:-production}
      VTT_FRONTEND_ORIGINS: ${VTT_FRONTEND_ORIGINS:-["http://localhost:8080"]}
      VTT_SUPABASE_URL: ${VTT_SUPABASE_URL:-}
      VTT_SUPABASE_PUBLISHABLE_KEY: ${VTT_SUPABASE_PUBLISHABLE_KEY:-}
      VTT_SUPABASE_SERVICE_ROLE_KEY: ${VTT_SUPABASE_SERVICE_ROLE_KEY:-}
      VTT_DATABASE_URL: ${VTT_DATABASE_URL:-}
      VTT_REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    networks: [backend]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs: ["/tmp"]

  web:
    build:
      context: frontend
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:-}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${VTT_HTTP_PORT:-8080}:8080"
    networks: [backend]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs:
      - /config
      - /data
      - /tmp

networks:
  backend:
    driver: bridge
