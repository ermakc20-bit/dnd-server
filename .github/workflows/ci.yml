name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # Disposable job-local service credentials; never a hosted project.
      VTT_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/vtt_ticket01
      VTT_TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install "pip==26.2"
      - run: .venv/bin/python -m pip install -e ".[dev]"
      - run: npm ci
      - run: npm --prefix frontend ci
      - run: npx supabase db start
      - run: .venv/bin/python scripts/acceptance_database.py --prepare-integration
      - run: make verify
      - run: make security
      - run: make test-database-replay
      - run: docker compose config --quiet
      - if: always()
        run: npx supabase stop

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx supabase db start
      - run: make test-database
      - if: always()
        run: npx supabase stop
